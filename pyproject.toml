[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brain-dump-pipeline"
version = "0.7.0"
description = "A personal Telegram capture and resurfacing service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "google-genai>=2.6,<3.0",
    "httpx>=0.28,<1.0",
    "notion-client>=3.1,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dateutil>=2.9,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.1,<2.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
